# =========================================================================
# Voice Transcription Service - Configuration Template
# =========================================================================

# -------------------------------------------------------------------------
# API Configuration
# -------------------------------------------------------------------------
api:
  # Base URL for the API endpoint
  # Use "https://openrouter.ai/api/v1" for OpenRouter
  base_url: "https://openrouter.ai/api/v1"

  # Transcription mode:
  #   "audio_api"        — OpenAI native /v1/audio/transcriptions
  #   "chat_completions" — Chat completions with base64 audio (OpenRouter)
  transcription_mode: "chat_completions"
# This configuration file controls the behavior of the voice transcription
# service. All settings can be overridden via environment variables or
# command-line arguments.
#
# Configuration Priority (high to low):
#   1. Command-line arguments (--api-key, --output-dir, etc.)
#   2. Environment variables (OPENAI_API_KEY, TRANSCRIBE_SKILL_*)
#   3. This YAML configuration file
#   4. Code defaults
# =========================================================================

# -------------------------------------------------------------------------
# Model Configuration
# -------------------------------------------------------------------------
# Controls the OpenAI API model and transcription parameters
model:
  # Model name for transcription
  # OpenAI: "gpt-4o-transcribe", "gpt-4o-mini-transcribe"
  # OpenRouter: "google/gemini-2.5-flash", "openai/gpt-4o-transcribe"
  name: "google/gemini-2.5-pro"

  # Language code for the audio content (ISO 639-1 format)
  # Common values: "zh" (Chinese), "en" (English), "ja" (Japanese), etc.
  # This helps improve transcription accuracy
  language: "zh"

  # Temperature for model randomness (0.0 to 1.0)
  # Lower values (0.0-0.3): More deterministic, consistent output
  # Higher values (0.7-1.0): More creative, varied output
  # Recommended: 0.0-0.2 for transcription tasks
  temperature: 0.2

  # Response format from the API
  # Options: "text", "json", "verbose_json", "srt", "vtt"
  # "text" returns plain transcript text (recommended for most use cases)
  # NOTE: applies to transcription_mode "audio_api" only — chat completions has
  # no equivalent and ignores this setting.
  response_format: "text"

  # Prompt to guide the transcription model
  # Used to improve punctuation, formatting, and context understanding
  # Keep it concise and relevant to your audio content
  #
  # The script-variant clause is load-bearing: on an A/B over the same 18 MB
  # memo, google/gemini-2.5-flash returned the whole transcript in Simplified
  # Chinese without it, and clean Traditional with it. google/gemini-2.5-pro
  # happened to return Traditional either way, so the clause makes explicit
  # what was only ever incidental.
  #
  # Deliberately NOT instructed: "put each sentence on its own line". pro
  # already segments one sentence per line unprompted (214 lines, zero
  # mid-clause breaks); asking for it produced 272 lines with 4 sentences
  # split at a comma.
  #
  # A proper-noun vocabulary measurably helps — the model produced 四字培訓 /
  # 四肢培訓 for 師資培訓, 神智學 for 人智學, and a different spelling of every
  # personal name on every run, which the refine stage then carried into the
  # vault as fact. But such a list is real people's names, so it does NOT
  # belong in this tracked file. Set it in the gitignored repo-root `.env` as
  # TRANSCRIBE_SKILL_PROMPT, which overrides this value wholesale — the same
  # split the directory settings already use (blank here, real value in .env).
  # When you do, keep the Traditional-Chinese clause: .env replaces this
  # string, it does not append to it.
  prompt: "Output in Traditional Chinese (Taiwan, 繁體中文) only — never Simplified Chinese. Add appropriate punctuation. Transcribe verbatim: do not summarise, omit, or rephrase."

# -------------------------------------------------------------------------
# File Handling Configuration
# -------------------------------------------------------------------------
# Controls which files can be processed and size limits
files:
  # List of supported audio file formats (case-insensitive)
  # These are the formats that the service will accept for transcription
  supported_formats:
    - ".m4a"  
    - ".mp3"   
    - ".wav"   
    - ".mp4"   

  # Maximum file size allowed for transcription (in megabytes).
  # NOTE: applies to transcription_mode "audio_api" only — 25MB is OpenAI's
  # documented per-file limit for a multipart audio upload. Chat completions
  # uses chat_max_file_size_mb below instead.
  max_file_size_mb: 25

  # Maximum file size for transcription_mode "chat_completions" (in megabytes).
  # Much lower than 25 because the wire format is different: the audio is
  # base64-encoded inside a single JSON request body, and Gemini caps an inline
  # request at 20MB *total* — prompt and scaffolding included. Measured
  # base64+JSON expansion on this exact body shape is 1.3334x, so
  # 20MiB / 1.3336 = 14.997MB of raw audio saturates the body exactly. 14 leaves
  # ~1.4MB of headroom for the prompt.
  #
  # Conservative by choice: whether OpenRouter forwards inline (so Gemini's cap
  # binds) or stages the audio via Google's Files API (so it does not) is
  # UNVERIFIED — no OpenRouter doc addresses it. 14 is correct either way, and
  # raising it later is a one-line change here.
  #
  # Files over this limit are not rejected outright — see the downsize block.
  chat_max_file_size_mb: 14

# -------------------------------------------------------------------------
# Sources (Input Discovery)
# -------------------------------------------------------------------------
# Default locations for discovering voice memos (not auto-scanned by default).
# Can be used by external wrappers or future `ingest` commands.
sources:
  # Default directory where voice memos are stored.
  # Machine-specific — DEFINED IN repo-root .env as VOICE_MEMO_DIR (takes precedence).
  # Leave blank here so the path is configured in one place (.env).
  voice_memo_directory: ""
  # Default synchronization date range (days) for DB selections
  # Used when --db-days is not provided on CLI
  default_sync_days: 30

# -------------------------------------------------------------------------
# Output Configuration
# -------------------------------------------------------------------------
# Controls where and how transcripts are saved
output:
  # Default directory for saving transcripts.
  # Machine-specific — DEFINED IN repo-root .env as RAW_TRANSCRIPT_DIR (takes precedence).
  # Can also be overridden with the --output-dir command-line argument.
  # Leave blank here so the path is configured in one place (.env).
  directory: ""

  # File extension for transcript output files
  # Output filename format: voice-memo_YYYYMMDD_HHMMSS<suffix>
  # Example: voice-memo_20250321_153045.md
  suffix: ".md"

  # Character encoding for output files
  # "utf-8" is recommended for international characters (Chinese, Japanese, etc.)
  encoding: "utf-8"

# -------------------------------------------------------------------------
# Database Configuration
# -------------------------------------------------------------------------
# SQLite database for tracking file metadata and processing status
database:
  # Path to the SQLite database file (relative or absolute)
  # The database stores: file metadata, processing status, output paths, errors
  # Auto-created on first run with proper schema
  path: "./audio_metadata.db"

  # Connection timeout in seconds
  # Prevents deadlocks when multiple processes access the database
  # Increase if you experience frequent timeout errors
  timeout: 10.0

# -------------------------------------------------------------------------
# Safety Safeguards
# -------------------------------------------------------------------------
# Prevents accidental large batch operations that could incur high API costs
safeguards:
  # Default maximum number of files to process in a single run
  # Can be overridden with --max-files command-line argument
  # Helps prevent accidentally processing hundreds of files
  default_max_files: 10

  # Number of files that triggers a confirmation prompt
  # If processing more than this number, --yes flag is required
  # Set to 0 to disable confirmation prompts (not recommended)
  confirmation_threshold: 3

  # Skip files already marked as "completed" in database by default
  # Set to false to always reprocess all selected files
  # Can be overridden with --force command-line flag
  skip_completed_by_default: true

# -------------------------------------------------------------------------
# Retry Behaviour
# -------------------------------------------------------------------------
# Bounded retry for a 200 response that arrives with no transcript (empty
# content, or a body with no "choices"). Observed transient on OpenRouter and
# more likely on reasoning models, which may spend their whole budget on
# reasoning tokens before emitting content.
#
# COST: every attempt is a separately billed call on the full audio payload
# (~$0.045-$0.075 per attempt for an 18 MB file on google/gemini-2.5-pro), so
# max_attempts is a cost ceiling: worst case = max_attempts x per-call cost.
#
# Not counted here: HTTP 408/409/429/5xx, connection errors and timeouts are
# already retried twice by the openai client itself.
retry:
  # Total API attempts per file, including the first. 1 disables retrying.
  max_attempts: 3

  # Base delay before a retry, doubling each time (2s, then 4s).
  backoff_seconds: 2.0

# -------------------------------------------------------------------------
# Automatic Downsize
# -------------------------------------------------------------------------
# What happens when a memo is larger than the size limit for the mode in use:
# instead of failing the file, re-encode a temporary copy at speech bitrate and
# send that. iOS Voice Memos records 48kHz stereo at ~98kbps, roughly three
# times what a transcription model needs to read speech, so the margin is there
# to reclaim. Measured: a 32.68MB / 46.7-minute memo became 10.94MB in 10.5s
# with the duration unchanged, and the same settings applied by hand to an
# earlier memo produced a transcript with every proper noun intact.
#
# The copy lives in a temp directory for the duration of one file's
# transcription and is deleted afterwards, including on Ctrl-C. Nothing is
# written next to the original.
#
# NOTE: one pass, no splitting. At 32kbps a 14MB cap is about 61 minutes of
# audio, so a recording longer than that still fails — with an error naming
# both sizes. Chunking a long recording into several requests is deliberately
# not implemented; lower bitrate_kbps or raise the cap instead.
downsize:
  # Set false to restore the old behaviour: an oversize file fails immediately.
  enabled: true

  # Audio channels in the copy. 1 (mono) halves the data for speech at no cost.
  channels: 1

  # Sample rate in Hz. 16000 is the standard speech-recognition rate.
  sample_rate: 16000

  # Bitrate of the copy in kbps. The main size lever: halving it roughly halves
  # the copy, at some cost to fidelity.
  bitrate_kbps: 32
